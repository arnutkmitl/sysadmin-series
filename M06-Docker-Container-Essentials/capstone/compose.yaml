# Capstone: Nginx -> Node.js -> MySQL + Redis, จัดการด้วย Portainer
services:
  proxy:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
    mem_limit: 64m
    cpus: 0.5
    networks: [frontend]

  app:
    build: ./app
    image: capstone-app:${APP_VERSION:-1.0}
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-1.0}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-capstone}
      DB_USER: ${DB_USER:-capstone}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    networks: [frontend, backend]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-capstone}
      MYSQL_USER: ${DB_USER:-capstone}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    networks: [backend]

  redis:
    image: redis:8.6
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
    mem_limit: 128m
    cpus: 0.5
    networks: [backend]

  portainer:
    image: portainer/portainer-ce:2.45.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    mem_limit: 128m
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
  redis_data:
  portainer_data:
