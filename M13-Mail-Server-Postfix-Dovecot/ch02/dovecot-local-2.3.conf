# /etc/dovecot/local.conf  ค่าของเล่ม M13 (Dovecot 2.3) อ่านหลัง conf.d/*.conf จึงทับค่าเดิม
protocols = imap pop3 lmtp

# กล่องแบบ Maildir ที่ Postfix สร้างไว้ในบทที่ 1 เป็นของผู้ใช้ vmail (uid 5000)
mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

# ผู้ใช้อีเมลอยู่ในไฟล์ /etc/dovecot/users ไม่ใช่ผู้ใช้ Linux
auth_mechanisms = plain login
auth_username_format = %Lu
passdb {
  driver = passwd-file
  args = scheme=BLF-CRYPT /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
}

# รับรหัสผ่านเฉพาะบนการเชื่อมต่อที่เข้ารหัสแล้ว
ssl = required
ssl_cert = </etc/letsencrypt/live/mail.example.com/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.example.com/privkey.pem
ssl_min_protocol = TLSv1.2

# ปิด port 143 และ 110 ที่ไม่เข้ารหัส เหลือ 993 และ 995
service imap-login {
  inet_listener imap {
    port = 0
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 0
  }
}

# socket ที่ Postfix ใช้ส่งอีเมลเข้ากล่อง (LMTP) และใช้ตรวจรหัสผ่าน (SASL)
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# สร้างโฟลเดอร์มาตรฐานให้ผู้ใช้ทุกคนอัตโนมัติ
namespace inbox {
  mailbox Drafts {
    auto = subscribe
  }
  mailbox Sent {
    auto = subscribe
  }
  mailbox Junk {
    auto = subscribe
  }
  mailbox Trash {
    auto = subscribe
  }
}
