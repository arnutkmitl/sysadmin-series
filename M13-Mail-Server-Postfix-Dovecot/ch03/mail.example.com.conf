# /etc/nginx/conf.d/mail.example.com.conf  webmail และ autoconfig ของ example.com
# port 80: ให้ certbot ตรวจชื่อ (webroot) ส่วนคำขออื่นส่งต่อไป HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com autoconfig.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# webmail: เปิดเฉพาะ public_html ของ Roundcube
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root  /usr/share/roundcubemail/public_html;
    index index.php;
    client_max_body_size 20m;

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php-fpm;
    }
}

# autoconfig: ไฟล์ตั้งค่าที่ Thunderbird อ่านเอง
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name autoconfig.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/autoconfig;
    location = /mail/config-v1.1.xml {
    }
    location / {
        return 404;
    }
}
