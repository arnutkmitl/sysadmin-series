# /etc/wireguard/wg1.conf (vpn2 สาขา)
[Interface]
Address = 10.9.1.2/30
ListenPort = 51821
PrivateKey = <private key ของ vpn2>

# สำนักงานใหญ่ (vpn1)
[Peer]
PublicKey = <public key ของ wg1 บน vpn1>
Endpoint = 192.168.56.90:51821
AllowedIPs = 10.9.1.1/32, 172.16.1.0/24, 10.9.0.0/24
PersistentKeepalive = 25
