# /etc/openvpn/server/tcp443.conf
port 443
proto tcp
dev tun1
ca ca.crt
cert vpn1.crt
key vpn1.key
dh none
tls-crypt tc.key
crl-verify crl.pem
server 10.10.1.0 255.255.255.0
topology subnet
push "route 172.16.1.0 255.255.255.0"
push "dhcp-option DNS 172.16.1.1"
keepalive 10 60
data-ciphers AES-256-GCM:CHACHA20-POLY1305
user openvpn
group openvpn
persist-tun
status /run/openvpn-server/status-tcp443.log 30
verb 3
