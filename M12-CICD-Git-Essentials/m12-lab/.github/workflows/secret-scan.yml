# .github/workflows/secret-scan.yml
name: secret-scan
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Look for secrets in tracked files
        run: |
          pattern='(PRIVATE KEY-----|password[[:space:]]*[=:]|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|glpat-)'
          if git grep -nEIi "$pattern" -- . ':!.env.example' ':!.github/workflows/secret-scan.yml'; then
            echo "::error::found text that looks like a secret"
            exit 1
          fi
          echo "no secrets found"
