// /etc/named.conf (ns2) แบบ split DNS
include "/etc/named.xfer.key";

acl "lan" { localhost; 192.168.56.50; };

options {
    listen-on port 53 { 127.0.0.1; 192.168.56.51; };
    listen-on-v6 port 53 { none; };
    directory       "/var/named";
    dump-file       "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    allow-query     { any; };
    allow-transfer  { none; };
    recursion no;
    managed-keys-directory "/var/named/dynamic";
    pid-file "/run/named/named.pid";
    session-keyfile "/run/named/session.key";
    include "/etc/crypto-policies/back-ends/bind.config";
};

logging {
    channel default_debug {
        file "data/named.run";
        severity dynamic;
    };
};

view "internal" {
    match-clients { !key external-xfer; key internal-xfer; lan; };

    zone "example.com" IN {
        type secondary;
        primaries { 192.168.56.50 key internal-xfer; };
        file "slaves/example.com.internal";
    };
    zone "56.168.192.in-addr.arpa" IN {
        type secondary;
        primaries { 192.168.56.50 key internal-xfer; };
        file "slaves/192.168.56.rev";
    };
    zone "lan.example.com" IN {
        type secondary;
        primaries { 192.168.56.50 key internal-xfer; };
        file "slaves/lan.example.com.internal";
    };
    zone "0.8.10.in-addr.arpa" IN {
        type secondary;
        primaries { 192.168.56.50 key internal-xfer; };
        file "slaves/10.8.0.rev";
    };
    include "/etc/named.rfc1912.zones";
};

view "external" {
    match-clients { any; };

    zone "example.com" IN {
        type secondary;
        primaries { 192.168.56.50 key external-xfer; };
        file "slaves/example.com.external";
    };
};
