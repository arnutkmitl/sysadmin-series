// /etc/kea/kea-dhcp-ddns.conf
{
"DhcpDdns": {
    "ip-address": "127.0.0.1",
    "port": 53001,
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "kea-ddns-ctrl-socket"
    },
    "tsig-keys": [
        {
            "name": "ddns-key",
            "algorithm": "HMAC-SHA256",
            "secret": "ใส่ secret จาก /etc/named.ddns.key"
        }
    ],
    "forward-ddns": {
        "ddns-domains": [
            {
                "name": "lan.example.com.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "192.168.56.50" } ]
            }
        ]
    },
    "reverse-ddns": {
        "ddns-domains": [
            {
                "name": "0.8.10.in-addr.arpa.",
                "key-name": "ddns-key",
                "dns-servers": [ { "ip-address": "192.168.56.50" } ]
            }
        ]
    },
    "loggers": [
        {
            "name": "kea-dhcp-ddns",
            "output-options": [ { "output": "stdout" } ],
            "severity": "INFO"
        }
    ]
}
}
