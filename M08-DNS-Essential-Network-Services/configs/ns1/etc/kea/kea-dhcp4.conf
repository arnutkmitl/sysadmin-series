// /etc/kea/kea-dhcp4.conf
{
"Dhcp4": {
    "interfaces-config": {
        "interfaces": [ "enp0s9" ]
    },
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "kea4-ctrl-socket"
    },
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "lfc-interval": 3600
    },
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "dhcp-ddns": {
        "enable-updates": true
    },
    "ddns-send-updates": true,
    "ddns-qualifying-suffix": "lan.example.com.",
    "ddns-replace-client-name": "never",
    "subnet4": [
        {
            "id": 1,
            "subnet": "10.8.0.0/24",
            "pools": [ { "pool": "10.8.0.100 - 10.8.0.199" } ],
            "option-data": [
                { "name": "routers", "data": "10.8.0.1" },
                { "name": "domain-name-servers", "data": "10.8.0.1" },
                { "name": "domain-name", "data": "lan.example.com" },
                { "name": "domain-search", "data": "lan.example.com, example.com" },
                { "name": "ntp-servers", "data": "10.8.0.1" }
            ],
            "reservations": [
                {
                    "hw-address": "08:00:27:7a:b9:6e",
                    "ip-address": "10.8.0.20",
                    "hostname": "pc1"
                }
            ]
        }
    ],
    "loggers": [
        {
            "name": "kea-dhcp4",
            "output-options": [ { "output": "stdout" } ],
            "severity": "INFO"
        }
    ]
}
}
