// /etc/named.conf (ns1) แบบ split DNS
include "/etc/named.xfer.key";
include "/etc/named.ddns.key";

acl "lan" { localhost; 10.8.0.0/24; };

options {
    listen-on port 53 { 192.168.56.50; };
    listen-on-v6 port 53 { none; };
    directory       "/var/named";
    dump-file       "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    allow-query     { any; };
    allow-transfer  { none; };
    recursion no;
    managed-keys-directory "/var/named/dynamic";
    pid-file "/run/named/named.pid";
    session-keyfile "/run/named/session.key";
    include "/etc/crypto-policies/back-ends/bind.config";
};

logging {
    channel default_debug {
        file "data/named.run";
        severity dynamic;
    };
};

view "internal" {
    match-clients { !key external-xfer; key internal-xfer; lan; };
    allow-transfer { key internal-xfer; };
    also-notify { 192.168.56.51 key internal-xfer; };

    zone "example.com" IN {
        type primary;
        file "example.com.zone";
    };
    zone "56.168.192.in-addr.arpa" IN {
        type primary;
        file "192.168.56.rev";
    };
    zone "lan.example.com" IN {
        type primary;
        file "dynamic/lan.example.com.zone";
        allow-update { key ddns-key; };
    };
    zone "0.8.10.in-addr.arpa" IN {
        type primary;
        file "dynamic/10.8.0.rev";
        allow-update { key ddns-key; };
    };
    include "/etc/named.rfc1912.zones";
};

view "external" {
    match-clients { any; };
    allow-transfer { key external-xfer; };
    also-notify { 192.168.56.51 key external-xfer; };

    zone "example.com" IN {
        type primary;
        file "example.com.external.zone";
    };
};
