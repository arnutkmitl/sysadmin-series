# /etc/sysctl.d/90-m10-hardening.conf
# ไม่รับ ICMP redirect: server ไม่ใช่ router เส้นทางไม่ควรถูกเปลี่ยนจากภายนอก
# ใช้ * ให้ครอบทุก interface ที่มีอยู่แล้ว ค่า all และ default อย่างเดียวไม่พอ
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
# ไม่ส่ง ICMP redirect
net.ipv4.conf.*.send_redirects = 0
# บันทึก packet ที่ source address เป็นไปไม่ได้
net.ipv4.conf.*.log_martians = 1
