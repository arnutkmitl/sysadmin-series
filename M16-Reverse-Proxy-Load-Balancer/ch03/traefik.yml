# /opt/traefik/traefik.yml  (static config: อ่านครั้งเดียวตอน Traefik เริ่ม)
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false          # container ต้องใส่ label traefik.enable=true เอง
  file:
    directory: /etc/traefik/dynamic  # route ไปเครื่องที่ไม่ใช่ container (be1, be2)
    watch: true

api:
  dashboard: true                    # เปิดผ่าน router ที่มีรหัสผ่าน ไม่ใช้ insecure

certificatesResolvers:
  pebble:
    acme:
      email: admin@lab.test
      storage: /acme/acme.json
      caServer: https://pebble:14000/dir   # Let's Encrypt จริง: ลบบรรทัดนี้
      httpChallenge:
        entryPoint: web

log:
  level: INFO
accessLog: {}
