# /etc/haproxy/haproxy.cfg  ขั้นที่ 2: HTTPS หลายโดเมน, ACME, sticky และ rate limit
global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/lib/haproxy/stats mode 660 level admin
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  forwardfor
    timeout connect         2s
    timeout client          30s
    timeout server          30s

frontend web_front
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    acl acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless { ssl_fc } || acme
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    use_backend acme_back if acme
    use_backend api_back if { req.hdr(host),host_only -i api.lab.test }
    default_backend web_back

backend acme_back
    server certbot 127.0.0.1:8888

backend web_back
    balance roundrobin
    cookie SRV insert indirect nocache httponly secure
    option httpchk GET /health
    http-check expect status 200
    server be1 192.168.56.73:8080 check inter 2s fall 3 rise 2 cookie be1
    server be2 192.168.56.74:8080 check inter 2s fall 3 rise 2 cookie be2

backend api_back
    balance leastconn
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 10 }
    option httpchk GET /health
    server be1 192.168.56.73:8080 check inter 2s fall 3 rise 2
    server be2 192.168.56.74:8080 check inter 2s fall 3 rise 2

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:LabStats-2569
