# /etc/haproxy/haproxy.cfg  ขั้นที่ 1: HTTP, health check และ Stats
global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/lib/haproxy/stats mode 660 level admin

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  forwardfor
    timeout connect         2s
    timeout client          30s
    timeout server          30s

frontend web_front
    bind *:80
    default_backend web_back

backend web_back
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server be1 192.168.56.73:8080 check inter 2s fall 3 rise 2
    server be2 192.168.56.74:8080 check inter 2s fall 3 rise 2

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats auth admin:LabStats-2569
