# /etc/keepalived/keepalived.conf บน lb2 (BACKUP)
global_defs {
    router_id lb2
    enable_script_security
    script_user root
}

vrrp_script chk_haproxy {
    script "/usr/libexec/keepalived/chk_haproxy.sh"
    interval 2
    fall 2
    rise 2
}

vrrp_instance VI_WEB {
    state BACKUP
    interface enp0s8
    virtual_router_id 75
    priority 100
    advert_int 1
    unicast_src_ip 192.168.56.72
    unicast_peer {
        192.168.56.71
    }
    authentication {
        auth_type PASS
        auth_pass Lab75vip
    }
    virtual_ipaddress {
        192.168.56.75/24 dev enp0s8
    }
    track_script {
        chk_haproxy
    }
}
