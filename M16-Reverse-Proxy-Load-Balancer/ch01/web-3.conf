# /etc/nginx/conf.d/web.conf  ขั้นที่ 3: หลัง certbot --nginx แล้วเพิ่ม timeout และ cache
upstream web_backend {
    server 192.168.56.73:8080 max_fails=3 fail_timeout=10s;
    server 192.168.56.74:8080 max_fails=3 fail_timeout=10s;
}

server {
    server_name web.lab.test;
    location / {
        proxy_pass http://web_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /static/ {
        proxy_pass http://web_backend;
        proxy_set_header Host $host;
        proxy_cache web_cache;
        proxy_cache_valid 200 60s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/web.lab.test/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/web.lab.test/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = web.lab.test) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name web.lab.test;
    return 404; # managed by Certbot
}
