# /etc/rear/local.conf บน prod: ReaR สร้าง rescue ISO และ backup ทั้งระบบไปที่ NFS บน bkp
OUTPUT=ISO
OUTPUT_URL=nfs://192.168.56.86/srv/backup/rear
BACKUP=NETFS
BACKUP_URL=nfs://192.168.56.86/srv/backup/rear
# เก็บ backup ทั้งเครื่องไว้สองชุด ชุดเก่าย้ายไปโฟลเดอร์ที่มีวันเวลาต่อท้าย
NETFS_KEEP_OLD_BACKUP_COPY=yes
# ReaR กู้ระบบปฏิบัติการและค่าตั้ง ส่วนข้อมูลที่เปลี่ยนตลอดเวลากู้จาก backup ของบทที่ 2 ถึง 4
# datadir ของฐานข้อมูลคัดลอกขณะทำงานไม่ได้ image ของ Docker ดึงใหม่ได้ และ /var/backup อยู่ใน restic แล้ว
BACKUP_PROG_EXCLUDE+=( '/var/lib/mysql/*' '/var/lib/pgsql/data/*' '/var/lib/pgsql/wal-archive/*'
                       '/var/lib/docker/*' '/var/lib/containerd/*' '/var/backup/*' '/srv/files/*' )
