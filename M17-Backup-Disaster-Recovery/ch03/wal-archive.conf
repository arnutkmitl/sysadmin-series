# /var/lib/pgsql/data/conf.d/wal-archive.conf บน prod: เก็บ WAL ทุกไฟล์สำหรับ Point-in-Time Recovery
# postgresql.conf ต้องมีบรรทัด include_dir = 'conf.d'
archive_mode = on
# ไม่เขียนทับไฟล์ที่มีอยู่แล้ว และคืนค่าไม่ใช่ 0 เมื่อคัดลอกไม่สำเร็จ PostgreSQL จะลองใหม่เอง
archive_command = 'test ! -f /var/lib/pgsql/wal-archive/%f && cp %p /var/lib/pgsql/wal-archive/%f'
# ปิดไฟล์ WAL ที่ยังไม่เต็มทุก 5 นาที RPO ของฐานนี้จึงไม่เกินราว 5 นาที
archive_timeout = 300
