# /home/admin/ansible-lab/ansible.cfg
[defaults]
inventory = inventory.yml
remote_user = ansible
private_key_file = ~/.ssh/id_ed25519
collections_path = ./collections
roles_path = ./roles
forks = 10
vault_password_file = ~/.ansible/vault-pass-m15
callback_result_format = yaml

[ssh_connection]
pipelining = True
