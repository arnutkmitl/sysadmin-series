---
# /home/admin/ansible-lab/playbooks/hosts-good.yml
# แก้ hosts-bad.yml: บอกสถานะที่ต้องการด้วย lineinfile
- name: เพิ่มชื่อ ctl ใน /etc/hosts แบบถูก
  hosts: rocky
  become: true
  tasks:
    - name: ให้มีบรรทัดของ ctl หนึ่งบรรทัด
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^192\.168\.56\.65\s'
        line: "192.168.56.65 ctl.lab.local ctl"
