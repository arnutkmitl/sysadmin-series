# /etc/httpd/conf.d/site2.conf
<VirtualHost *:80>
    ServerName site2.lab.test
    DocumentRoot /var/www/site2
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://site2.lab.test%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName site2.lab.test
    DocumentRoot /var/www/site2
    ErrorLog  /var/log/httpd/site2-error.log
    CustomLog /var/log/httpd/site2-access.log combined

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/site2.lab.test/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/site2.lab.test/privkey.pem
    Protocols h2 http/1.1

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'"

    <Directory /var/www/site2>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
