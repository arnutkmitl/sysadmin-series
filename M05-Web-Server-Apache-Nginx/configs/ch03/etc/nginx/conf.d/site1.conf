# /etc/nginx/conf.d/site1.conf
# HTTP ทุกชื่อ ส่งไป https://site1.lab.test
server {
    listen 80;
    server_name site1.lab.test www.site1.lab.test;
    return 301 https://site1.lab.test$request_uri;
}

# https://www ส่งไปชื่อหลัก
server {
    listen 443 ssl;
    server_name www.site1.lab.test;
    ssl_certificate     /etc/letsencrypt/live/site1.lab.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site1.lab.test/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://site1.lab.test$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name site1.lab.test;
    root /var/www/site1;
    access_log /var/log/nginx/site1-access.log;
    error_log  /var/log/nginx/site1-error.log;

    ssl_certificate     /etc/letsencrypt/live/site1.lab.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site1.lab.test/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/security-headers.conf;

    location ~* \.(css|js|png|jpg|jpeg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
