# /etc/httpd/conf.d/site1.conf
<VirtualHost *:80>
    ServerName site1.lab.test
    DocumentRoot /var/www/site1
    ErrorLog  /var/log/httpd/site1-error.log
    CustomLog /var/log/httpd/site1-access.log combined
    <Directory /var/www/site1>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
