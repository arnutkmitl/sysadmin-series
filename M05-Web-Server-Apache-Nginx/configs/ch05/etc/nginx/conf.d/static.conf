# /etc/nginx/conf.d/static.conf
server {
    listen 80;
    server_name static.lab.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name static.lab.test;
    root /var/www/static;
    access_log /var/log/nginx/static-access.log;
    error_log  /var/log/nginx/static-error.log;

    ssl_certificate     /etc/letsencrypt/live/static.lab.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/static.lab.test/privkey.pem;
    include snippets/ssl.conf;
    include snippets/headers.conf;
    add_header Content-Security-Policy "default-src 'self'" always;

    location ~* \.(css|js|png|jpg|jpeg|svg|woff2)$ {
        expires 30d;
        include snippets/headers.conf;
        add_header Content-Security-Policy "default-src 'self'" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
