# /home/admin/monitoring/grafana/provisioning/datasources/prometheus.yml
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
    basicAuth: true
    basicAuthUser: admin
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/prometheus_password}
