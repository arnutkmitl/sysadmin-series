# /home/admin/monitoring/alertmanager/alertmanager.lab.yml (Lab เท่านั้น: ส่ง Telegram ไปปลายทางจำลอง)
global:
  resolve_timeout: 5m
  smtp_smarthost: mailpit:1025
  smtp_from: alertmanager@lab.local
  smtp_require_tls: false

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: email
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
    - matchers: [severity="warning"]
      receiver: telegram
    - matchers: [severity="info"]
      receiver: email

inhibit_rules:
  - source_matchers: [alertname="InstanceDown"]
    target_matchers: [severity=~"warning|info"]
    equal: [instance]

receivers:
  - name: critical
    telegram_configs:
      - api_url: http://lab-mock-api:8080
        bot_token_file: /run/secrets/telegram_bot_token
        chat_id: 123456789
        parse_mode: HTML
        message: '{{ template "telegram.m14" . }}'
        send_resolved: true
    webhook_configs:
      - url: http://line-bridge:8080/alert
        send_resolved: true

  - name: telegram
    telegram_configs:
      - api_url: http://lab-mock-api:8080
        bot_token_file: /run/secrets/telegram_bot_token
        chat_id: 123456789
        parse_mode: HTML
        message: '{{ template "telegram.m14" . }}'
        send_resolved: true

  - name: email
    email_configs:
      - to: admin@lab.local
        send_resolved: true
