# /home/admin/monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml
  - recording_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    basic_auth:
      username: admin
      password_file: /run/secrets/prometheus_password
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["192.168.56.55:9100"]
        labels:
          role: monitoring
      - targets: ["192.168.56.56:9100"]
        labels:
          role: app

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: nginx
    static_configs:
      - targets: ["192.168.56.56:9113"]

  - job_name: mariadb
    static_configs:
      - targets: ["192.168.56.56:9104"]

  - job_name: shop
    static_configs:
      - targets: ["192.168.56.56:8001"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://192.168.56.56/
          - http://192.168.56.56:8000/order
          - https://rockylinux.org/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: pushgateway
    honor_labels: true
    basic_auth:
      username: push
      password_file: /run/secrets/push_password
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
